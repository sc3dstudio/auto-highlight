schema_version = "1.0.0"

# Matches the Python package name on purpose. Blender imports an extension under
# its id, so this is the name `__package__` will have at runtime -- and
# properties.py resolves the add-on preferences through `__package__`. Two
# different names for one thing would work and be a trap later.
id = "outliner_highlight"

version = "0.1.1"
name = "Outliner Auto-Highlight"
# 64 characters maximum, enforced by `blender --command extension validate`.
tagline = "Reveals the active object in the Outliner, collapses the rest"
maintainer = "sc3d.studio <contact@sc3d.studio>"
type = "add-on"

# GPL-3.0-or-later, and not the GPL-2.0-or-later that matches Blender's own
# source. Older Blender versions reject a 2.0 add-on outright, with "license for
# add-ons must be GPL v3.0 or later" -- which is how this line was found after
# 0.1.0 shipped. 5.2 accepts the 2.0 id, so the rejecting build cannot be
# reproduced locally; 3.0-or-later is the only value that installs everywhere.
license = ["SPDX:GPL-3.0-or-later"]

# The extension format itself starts at 4.2. Only 5.2.1 has actually been run --
# see docs/technical-notes.md.
blender_version_min = "4.2.0"

# The canonical spelling. "Interface" is the value most add-ons copy around and
# is not in the list the validator accepts, for extensions or for bl_info.
tags = ["User Interface"]
website = "https://github.com/sc3dstudio/auto-highlight"
